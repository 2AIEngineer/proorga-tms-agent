[project]
name = "tms-mcp-server"
version = "0.1.0"
description = "Serveur MCP de l'orchestrateur : expose le TMS (lecture seule) et la base de l'agent (alertes, notifications, journal) sous forme de tools sémantiques."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
tms-mcp = "tms_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tms_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
