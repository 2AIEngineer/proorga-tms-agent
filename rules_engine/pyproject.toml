[project]
name = "rules-engine"
version = "0.1.0"
description = "Moteur de règles métier déclaratif (YAML) pour la surveillance des missions de transport."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
rules-engine = "rules_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rules_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
