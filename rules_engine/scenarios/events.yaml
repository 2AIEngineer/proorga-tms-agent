      - { id: evt_012, type: driver_message, occurred_at: "2025-11-04T10:05:00Z", position: { lat: 33.75, lon: -7.25 }, payload: { severity: critical, category: accident, text: "Accrochage avec un véhicule léger, pas de blessé." }, source: driver_app }
    expect:
      triggered: [critical_incident]

  - name: Message chauffeur non critique → pas d'alerte
    now: "2025-11-04T10:05:00Z"
    new_events:
      - { id: evt_013, type: driver_message, occurred_at: "2025-11-04T10:05:00Z", payload: { severity: low, text: "Pause café." }, source: driver_app }
    expect:
      triggered: []

  - name: Deux nouveaux événements dont un incident, avec une dérive en cours → les deux familles de règles
    now: "2025-11-04T10:05:00Z"
    snapshot:
      deviation: { current_offset_km: 7.1, current_offset_since: "2025-11-04T09:30:00Z", duration_minutes: 35 }
    new_events:
      - { id: evt_014, type: loading_completed, occurred_at: "2025-11-04T10:01:00Z", payload: {}, source: driver_app }
      - { id: evt_015, type: driver_message, occurred_at: "2025-11-04T10:05:00Z", payload: { severity: critical, text: "Malaise du chauffeur." }, source: driver_app }
    expect:
      triggered: [critical_incident, deviation_persistent]
