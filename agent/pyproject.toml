[project]
name = "tms-agent"
version = "0.1.0"
description = "Agent IA de suivi des missions de transport : boucle de surveillance LangGraph, moteur de règles déclaratif, enquêtes et assistant opérateur avec Claude, accès au TMS exclusivement via MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=2.2",
    "openai>=1.50",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[tool.uv.sources]
# Membre du même espace de travail uv (voir ../pyproject.toml). Dépendance de test uniquement
# (tests de bout en bout en mémoire) : en production, l'agent se connecte au serveur MCP en HTTP.
tms-mcp-server = { workspace = true }

[project.scripts]
tms-agent = "tms_agent.cli:main"
rules-engine = "tms_agent.rules_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "tms-mcp-server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tms_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
